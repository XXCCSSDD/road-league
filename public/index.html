<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d10">
  <title>Road League</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">ROAD LEAGUE</p>
      <div class="hero-row">
        <div>
          <h1 id="rider-name">Hutchy</h1>
          <p id="rider-title">Loading rider profile…</p>
        </div>
        <div class="streak-card"><span>Streak</span><strong id="streak">—</strong></div>
      </div>
    </header>

    <section class="stats" aria-label="Career statistics">
      <article><span>Level</span><strong id="level">—</strong></article>
      <article><span>XP</span><strong id="xp">—</strong></article>
      <article><span>Miles</span><strong id="miles">—</strong></article>
      <article><span>Climbing</span><strong id="climbing">—</strong></article>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div><p class="eyebrow">TODAY</p><h2>Choose your mission</h2></div>
        <button class="ghost" type="button">Map layers</button>
      </div>
      <div id="missions" class="mission-grid">
        <article class="empty-state">Daily missions will appear here once route generation is connected.</article>
      </div>
    </section>

    <section class="panel">
      <div class="section-heading"><div><p class="eyebrow">RECENT</p><h2>Your rides</h2></div></div>
      <div id="rides" class="ride-list"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
